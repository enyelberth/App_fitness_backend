name: CI Pipeline

on:
  push:
    branches:
      - master
      - enyelberth-dev
      - 'feature/**'
  pull_request:
    branches:
      - master
      - enyelberth-dev

jobs:
  quality:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitness_ci
          POSTGRES_PASSWORD: fitness_ci_password
          POSTGRES_DB: fitness_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Get pnpm cache directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://fitness_ci:fitness_ci_password@localhost:5432/fitness_test_db
        run: pnpm db:generate

      - name: Build project
        run: pnpm build

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        env:
          DATABASE_URL: postgresql://fitness_ci:fitness_ci_password@localhost:5432/fitness_test_db
        run: pnpm test:cov
        continue-on-error: true  # Tests are optional for now (spec files missing)

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true  # Optional if codecov is not configured

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          echo "✓ Build successful"
          ls -lah dist/ | head -20

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit pnpm dependencies
        run: pnpm audit --audit-level moderate
        continue-on-error: true  # Advisory for now

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
        continue-on-error: true  # Informational only

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image (production)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (development)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitness_health
          POSTGRES_PASSWORD: fitness_health_password
          POSTGRES_DB: fitness_health_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://fitness_health:fitness_health_password@localhost:5432/fitness_health_db
        run: pnpm db:generate

      - name: Build project
        run: pnpm build

      - name: Verify health endpoint exists
        run: |
          if grep -r "GET.*health" dist/modules/health/ 2>/dev/null; then
            echo "✓ Health endpoint found in compiled code"
          else
            echo "Warning: Health endpoint verification inconclusive"
          fi
